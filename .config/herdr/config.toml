onboarding = false

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+a"
detach = "prefix+d"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

[ui]
# Shared on purpose: herdr has no per-machine config layering, so this accent is
# the same everywhere. Per-cluster colours live in ~/.config/host-style.sh (tmux).
accent = "#b4befe"
pane_outer_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%Y-%m-%d %H:%M" },
]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

# herdr-nav-plus
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nav-plus.left"
description = "navigate left (vim/pane)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nav-plus.down"
description = "navigate down (vim/pane/workspace)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nav-plus.up"
description = "navigate up (vim/pane/workspace)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nav-plus.right"
description = "navigate right (vim/pane)"

# drovr
[[keys.command]]
key = "prefix+M"
type = "plugin_action"
command = "drovr.move-tab"
description = "move tab to workspace"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "drovr.move-pane"
description = "move pane to tab"

# herdr-resurrect
[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore"

# named spaces (below)
[[keys.command]]
key = "prefix+S"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save-space"
description = "resurrect: save this space as…"

[[keys.command]]
key = "prefix+O"
type = "plugin_action"
command = "ntindle.herdr-resurrect.open-space"
description = "resurrect: open saved space…"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-synapse.team-up"
description = "teams"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "herdr-synapse.console"
description = "team console"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "herdr-synapse.toggle-view"
description = "team view"

[[keys.command]]
key = "prefix+F"
type = "plugin_action"
command = "herdr-synapse.mission"
description = "mission control"

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent"],
  [{ token = "$team_role", fg = "#f9e2af" }, { token = "$team_task", fg = "#89b4fa" }, { token = "$team_context", fg = "#a6adc8" }],
  ["workspace", "tab"],
]
